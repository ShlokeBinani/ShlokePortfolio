<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shloke Binani</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script intercepts 404 responses on GitHub Pages,
      // converts the requested path and query into a query parameter,
      // and redirects to the index page so client-side routing works on refresh.

      var l = window.location;
      // If deployed under /ShlokePortfolio/, keep 1 segment; otherwise on root/custom domain keep 0
      var pathSegmentsToKeep = l.pathname.toLowerCase().startsWith('/shlokeportfolio') ? 1 : 0;

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #0C0C0C; color: #F5F5F7; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h1 style="font-size: 24px; font-weight: 600; margin-bottom: 8px;">Redirecting...</h1>
      <p style="font-size: 14px; color: #A1A1AA;">Loading Shloke Binani Portfolio...</p>
    </div>
  </body>
</html>
